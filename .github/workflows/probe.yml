name: probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: full tcp sweep from clean IP
        run: |
          sudo apt-get update -qq >/dev/null 2>&1
          sudo apt-get install -y -qq nmap >/dev/null 2>&1
          echo "############ 4.148.93.130 full"
          sudo nmap -Pn -n --open -T4 -p- --min-rate 3000 4.148.93.130 || true
          echo "############ 4.227.70.59 full"
          sudo nmap -Pn -n --open -T4 -p- --min-rate 3000 4.227.70.59 || true
          echo "############ service/version on whatever is open"
          sudo nmap -Pn -n -sV -p 1025 4.148.93.130 || true
          echo "############ UDP top 50 "
          sudo nmap -Pn -n --open -sU --top-ports 50 4.148.93.130 || true
